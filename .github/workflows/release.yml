name: release & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.rp.outputs.tag_name || steps.rp2.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # NOTE: auto-merge the release PR, then run release-please again so it tags the release in this same run
      - id: merge
        if: steps.rp.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list -R "$GITHUB_REPOSITORY" --head release-please--branches--main --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh pr merge "$n" -R "$GITHUB_REPOSITORY" --squash --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi
      - id: rp2
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt && pytest
      - uses: appleboy/ssh-action@v1.2.5
        env:
          REF: ${{ needs.release-please.outputs.tag_name || github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REF
          script: |
            set -e
            cd ~/hospital-chatbot
            git fetch --tags --force origin
            git checkout --force "$REF"
            docker compose up -d --build --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
            for i in $(seq 1 60); do
              docker compose exec -T app python -c "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')" >/dev/null 2>&1 && break
              echo "waiting for app to start ($i)"
              sleep 5
            done
            docker compose exec -T app python -c "import urllib.request as u; print(u.urlopen('http://localhost:8000/api/v1/health').read().decode())"
            docker compose ps
