name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt
      - run: pytest
