name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt
      - run: pytest
      - run: python -m app.services.guards
