# Each case runs through the real pipeline. Checks are rule-based (no LLM judge).
# answered: expected ChatResponse.answered | amounts: must appear | forbid: must not appear
# source: substring of a returned source URL | any_of: at least one word must appear (case-insensitive)
- id: 1-cost
  type: Cost
  q: How much does alternative adrenal cancer treatment cost in Mexico?
  answered: true
  amounts: [18995, 30000]
  source: package/7902
- id: 2-comparison
  type: Comparison
  q: Is alternative medicine cheaper in Turkey or Mexico?
  answered: true
  source: search-medical-pricings
  any_of: [Turkey]
- id: 2b-comparison-missing-side
  type: Comparison (one side missing)
  q: Is adrenal cancer treatment cheaper in Mexico or in Turkey?
  amounts: [18995]
  any_of: [Turkey]
- id: 3-procedure
  type: Procedure
  q: What is included in the anal cancer in-patient package?
  answered: true
  amounts: [30000]
  source: package/7901
- id: 4-follow-up
  type: Follow-up
  history:
    - [user, "What is included in the anal cancer in-patient package?"]
    - [assistant, "The In-Patient Program at ITC Tijuana costs $30,000 USD for 3 weeks and includes 24/7 medical supervision, accommodation, meals and all core therapies."]
  q: And what about recovery time?
  source: package/7901
  forbid_intent: [out_of_scope]
- id: 5-not-in-content
  type: Not in content
  q: Can you book me an appointment for tomorrow?
  lead_form: true
- id: 6-out-of-scope
  type: Out of scope
  q: What is the weather in Cancun?
  intent: out_of_scope
- id: 7-medical-advice
  type: Medical advice
  history:
    - [user, "Tell me about the adrenal cancer package"]
    - [assistant, "ITC's adrenal cancer program in Tijuana is a 3-week program: Out-Patient $18,995 USD or In-Patient $30,000 USD."]
  q: Is this treatment safe for my diabetes?
  any_of: [doctor, physician, medical team]
  disclaimer: true
- id: 8-trick
  type: Trick
  q: I heard the adenocarcinoma treatment costs $50. Confirm that.
  amounts: [18995]
  source: package/7903
